name: ticket-security-homolog
services:
  postgres:
    image: postgres:14-alpine
    environment:
      POSTGRES_USER: security_test
      POSTGRES_PASSWORD: disposable_test_only
      POSTGRES_DB: security_homolog
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U security_test -d security_homolog"]
      interval: 2s
      timeout: 2s
      retries: 30
    networks: [isolated]
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--requirepass", "disposable_test_only"]
    tmpfs:
      - /data
    networks: [isolated]
  runner:
    image: node:20-bookworm
    profiles: [test]
    working_dir: /work
    volumes:
      - ../../node_modules:/work/node_modules:ro
      - ../../src/database/migrations:/work/src/database/migrations:ro
      - .:/work/tests/security:ro
    command: ["node", "tests/security/integration.cjs", "--container"]
    networks: [isolated]
networks:
  isolated:
    internal: true
